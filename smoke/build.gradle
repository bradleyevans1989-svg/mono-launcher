// Robolectric checks that run the launcher's screens and the assistant loop on the JVM.
// Only used for tests: the shipped APK is built by ../build.sh.
plugins { id 'com.android.application' version '8.7.3' }

android {
    namespace 'au.com.mono.launcher'
    compileSdk 35
    defaultConfig {
        minSdk 26
        targetSdk 35
    }
    sourceSets {
        main {
            java.srcDirs = ['../src']
            assets.srcDirs = ['../assets']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.enabledSdks', '35'
            testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
